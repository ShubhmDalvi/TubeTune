<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <style>
    :root {
      --bg: #090A0F;
      --surface: rgba(255, 255, 255, 0.04);
      --surface-hover: rgba(255, 255, 255, 0.07);
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.14);
      --text: #F5F5F7;
      --text-muted: #8E8E93;
      --text-faint: #8E8E93;
      --knob: #F5F5F7;
      --track-off: rgba(255, 255, 255, 0.14);
      --spring: cubic-bezier(0.16, 1, 0.3, 1);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: auto !important;
      min-height: 0 !important;
    }

    body {
      width: 280px;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      -webkit-user-select: none;
      user-select: none;
      overflow-x: hidden;
    }

    /* Ambient top glow */
    .ambient {
      position: fixed;
      top: -80px;
      left: 50%;
      transform: translateX(-50%);
      width: 340px;
      height: 220px;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.02) 45%, transparent 70%);
      filter: blur(6px);
      pointer-events: none;
      z-index: 0;
    }

    .app {
      position: relative;
      z-index: 1;
      height: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
    }

    /* ── Header ─────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    /* ── Apple toggle ────────────────────────── */
    .toggle {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 28px;
      flex-shrink: 0;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .track {
      position: absolute;
      inset: 0;
      background: var(--track-off);
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.35s var(--spring), box-shadow 0.35s var(--spring);
    }

    .track::before {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--knob);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45), 0 0 0 0.5px rgba(0, 0, 0, 0.15);
      transition: transform 0.35s var(--spring), background 0.35s var(--spring);
    }

    .toggle input:checked + .track {
      background: var(--knob);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), 0 1px 3px rgba(0, 0, 0, 0.25);
    }

    .toggle input:checked + .track::before {
      transform: translateX(18px);
      background: var(--bg);
    }

    .toggle input:focus-visible + .track {
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.25);
    }

    /* ── Control card ────────────────────────── */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      padding: 0 2px;
    }

    /* Custom dropdown */
    .dropdown {
      position: relative;
    }

    .dropdown-trigger {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 11px;
      color: var(--text);
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.25s var(--spring), border-color 0.25s var(--spring), box-shadow 0.25s var(--spring);
    }

    .dropdown-trigger:hover {
      background: var(--surface-hover);
      border-color: var(--border-strong);
    }

    .dropdown-trigger:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.18);
    }

    .dropdown-trigger .chevron {
      width: 16px;
      height: 16px;
      color: var(--text-muted);
      transition: transform 0.3s var(--spring), color 0.25s var(--spring);
    }

    .dropdown.open .dropdown-trigger .chevron {
      transform: rotate(180deg);
      color: var(--text);
    }

    .dropdown-menu {
      position: relative;
      background: rgba(24, 25, 33, 0.92);
      backdrop-filter: blur(24px) saturate(1.4);
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      max-height: 0;
      opacity: 0;
      padding: 0;
      margin-top: 0;
      overflow-y: auto;
      pointer-events: none;
      transition: max-height 0.4s var(--spring), opacity 0.3s var(--spring), padding 0.3s var(--spring), margin-top 0.35s var(--spring);
    }

    .dropdown-menu::-webkit-scrollbar {
      width: 5px;
    }

    .dropdown-menu::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 3px;
    }

    .dropdown.open .dropdown-menu {
      max-height: 560px;
      opacity: 1;
      padding: 5px;
      margin-top: 8px;
      pointer-events: auto;
    }

    .option {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s var(--spring);
    }

    .option:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .option:focus-visible {
      outline: none;
      background: rgba(255, 255, 255, 0.08);
    }

    .option .option-name {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .option .option-hint {
      font-size: 11px;
      color: var(--text-faint);
    }

    .option .check {
      width: 15px;
      height: 15px;
      color: var(--text);
      opacity: 0;
      transform: scale(0.6);
      transition: opacity 0.2s var(--spring), transform 0.3s var(--spring);
    }

    .option.selected .check {
      opacity: 1;
      transform: scale(1);
    }

    /* ── Empty state ─────────────────────────── */
    .empty-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 12px;
      padding: 26px 8px 18px;
    }

    .empty-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.03));
      border: 1px solid var(--border-strong);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
    }

    .empty-title {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.1px;
    }

    .empty-sub {
      font-size: 11.5px;
      line-height: 1.5;
      color: var(--text-faint);
      max-width: 220px;
    }

    /* Site states */
    body.site-invalid .controls,
    body.site-invalid .toggle,
    body.site-invalid .footer {
      display: none;
    }

    body.site-invalid .empty-state {
      display: flex;
    }

    /* ── Status toast ────────────────────────── */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%) translateY(8px);
      padding: 7px 14px;
      background: rgba(24, 25, 33, 0.85);
      backdrop-filter: blur(20px) saturate(1.4);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      border: 1px solid var(--border-strong);
      border-radius: 100px;
      color: var(--text);
      font-size: 11.5px;
      letter-spacing: 0.02em;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
      transition: opacity 0.35s var(--spring), transform 0.4s var(--spring);
      z-index: 30;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Footer ──────────────────────────────── */
    .footer {
      text-align: center;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 0.04em;
      padding-top: 2px;
    }
  </style>
</head>
<body class="site-invalid">
  <div class="ambient"></div>

  <div class="app">
    <header class="header">
      <div class="brand">
        <h1 class="brand-title">TubeTune</h1>
      </div>

      <label class="toggle" id="extension-toggle-wrap">
        <input type="checkbox" id="extension-toggle">
        <span class="track"></span>
      </label>
    </header>

    <div class="controls" id="controls">
      <label class="label" for="quality-trigger">Default Quality</label>

      <div class="dropdown" id="dropdown">
        <button type="button" class="dropdown-trigger" id="quality-trigger" aria-haspopup="listbox" aria-expanded="false">
          <span id="quality-value">1080p</span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>

        <div class="dropdown-menu" id="quality-menu" role="listbox" aria-label="Default quality"></div>
      </div>
    </div>

    <div class="empty-state" id="empty-state">
      <div class="empty-icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="8 12 12 16 16 12"></polyline>
          <line x1="12" y1="8" x2="12" y2="16"></line>
        </svg>
      </div>
      <div class="empty-title">Works on YouTube only</div>
      <div class="empty-sub">Open YouTube or YouTube Music to adjust your default video quality.</div>
    </div>

    <footer class="footer">Settings apply to all YouTube videos</footer>
  </div>

  <div class="toast" id="status-message" role="status" aria-live="polite"></div>

  <script src="popup.js"></script>
</body>
</html>
